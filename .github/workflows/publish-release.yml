name: Publish preview release
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful verify-and-build manual run with both installer artifacts
        required: true
        type: string
      expected_sha:
        description: Full commit SHA verified by that build
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-preview-release
      cancel-in-progress: false
    steps:
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          test "$(jq -r .status run.json)" = completed
          test "$(jq -r .conclusion run.json)" = success
          test "$(jq -r .head_sha run.json)" = "$EXPECTED_SHA"
          test "$(jq -r .path run.json)" = .github/workflows/ci.yml
          test "$(jq -r .event run.json)" = workflow_dispatch
          test "$(jq -r .head_repository.full_name run.json)" = "$GH_REPO"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Download verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]
          test "$(jq -r .version src/edition.json)" = "$VERSION"
          test "$(jq -r .version plugins/openclaw/package.json)" = "$VERSION"
          test -f "docs/releases/v$VERSION.md"
          gh run download "$BUILD_RUN_ID" --name unsigned-macOS --dir artifacts/macOS
          gh run download "$BUILD_RUN_ID" --name unsigned-Windows --dir artifacts/Windows
          mkdir release
          # GitHub normalizes spaces in uploaded asset names. Use those exact
          # download names before hashing so sha256sum -c works after download.
          cp "artifacts/macOS/CLI Account Switch-$VERSION-mac-universal.dmg" "release/CLI.Account.Switch-$VERSION-mac-universal.dmg"
          cp "artifacts/Windows/CLI Account Switch-$VERSION-win-x64-setup.exe" "release/CLI.Account.Switch-$VERSION-win-x64-setup.exe"
          cp "artifacts/Windows/CLI Account Switch-$VERSION-win-x64-portable.exe" "release/CLI.Account.Switch-$VERSION-win-x64-portable.exe"
          (cd release && sha256sum *.dmg *.exe > SHA256SUMS.txt)
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          cp "docs/releases/v$VERSION.md" notes.md
          printf '\nBuild: `%s` — https://github.com/%s/actions/runs/%s\n' "$EXPECTED_SHA" "$GH_REPO" "$BUILD_RUN_ID" >> notes.md
          gh release create "v$VERSION" release/* --target "$EXPECTED_SHA" --title "CLI Account Switch v$VERSION" --notes-file notes.md --prerelease
