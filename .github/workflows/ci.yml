name: verify-and-build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install uv for relocatable research fixtures
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
      - name: Install fixture Python
        if: runner.os == 'macOS'
        run: uv python install 3.12
      - run: npm run test:structural
        if: runner.os == 'macOS'
      - run: npm run test:runtime
        if: runner.os == 'macOS'
      - run: npm run test:dashboard
        if: runner.os == 'macOS'
      - run: npm run test:reset-ui
        if: runner.os == 'macOS'
      - run: npm run build:plugin
      - run: npm run dist:mac
        if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run dist:win
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: unsigned-${{ runner.os }}
          path: dist/*
          retention-days: 7
